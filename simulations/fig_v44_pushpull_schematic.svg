<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="agrn" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/></marker>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="adk" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b586a"/></marker>
    <marker id="tbar" markerWidth="14" markerHeight="18" refX="3" refY="9" orient="auto"><path d="M3,2 L3,16" stroke="#c0392b" stroke-width="3.4"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="880" fill="#ffffff"/>

  <!-- title -->
  <text x="34" y="46" font-size="27" font-weight="700" fill="#1b2430">EZH2 &amp; CyclinD1 — the push and pull</text>
  <text x="34" y="72" font-size="14.5" fill="#5b6675">What drives each <tspan fill="#146b39" font-weight="700">up (green)</tspan> and <tspan fill="#97281c" font-weight="700">down (red)</tspan>, and the H3K27me3 feedback that couples them.</text>

  <!-- ===================== GREEN UP-PUSHES (top row) ===================== -->
  <!-- left cluster -> EZH2 -->
  <g font-size="11.5" text-anchor="middle">
    <g><rect x="55" y="112" width="158" height="44" rx="9" fill="#e6f4ec" stroke="#1f8a4c"/><text x="134" y="130" fill="#146b39">mitogen dose</text><text x="134" y="145" fill="#146b39">(Rb–E2f target)</text></g>
    <g><rect x="228" y="112" width="158" height="44" rx="9" fill="#e6f4ec" stroke="#1f8a4c"/><text x="307" y="130" fill="#146b39">proliferation</text><text x="307" y="145" fill="#146b39">E2f × CycE/A</text></g>
    <g><rect x="401" y="112" width="158" height="44" rx="9" fill="#e6f4ec" stroke="#1f8a4c"/><text x="480" y="130" fill="#146b39">long S-phase</text><text x="480" y="145" fill="#146b39">(EZH2 integrates)</text></g>
  </g>
  <g stroke="#1f8a4c" stroke-width="2" fill="none" marker-end="url(#agrn)">
    <path d="M134,158 C150,200 250,214 300,248"/>
    <path d="M307,158 L318,246"/>
    <path d="M480,158 C466,200 380,214 342,248"/>
  </g>

  <!-- right cluster -> CyclinD1 -->
  <g font-size="11.5" text-anchor="middle">
    <g><rect x="662" y="112" width="150" height="44" rx="9" fill="#e6f4ec" stroke="#1f8a4c"/><text x="737" y="130" fill="#146b39">Hedgehog</text><text x="737" y="145" fill="#146b39">→ Gli1 (gas)</text></g>
    <g><rect x="822" y="112" width="150" height="44" rx="9" fill="#e6f4ec" stroke="#1f8a4c"/><text x="897" y="130" fill="#146b39">MYCN</text><text x="897" y="145" fill="#146b39">(floor)</text></g>
    <g><rect x="982" y="112" width="150" height="44" rx="9" fill="#e6f4ec" stroke="#1f8a4c"/><text x="1057" y="137" fill="#146b39">basal tx</text></g>
  </g>
  <g stroke="#1f8a4c" stroke-width="2" fill="none" marker-end="url(#agrn)">
    <path d="M737,158 C755,220 800,260 820,298"/>
    <path d="M897,158 L868,298"/>
    <path d="M1057,158 C1040,220 950,262 902,298"/>
  </g>

  <!-- ===================== NODES ===================== -->
  <!-- EZH2 -->
  <rect x="225" y="250" width="190" height="70" rx="12" fill="#efeaf7" stroke="#7a5aa6" stroke-width="2.4"/>
  <text x="320" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#573f80">EZH2</text>
  <text x="320" y="305" text-anchor="middle" font-size="10.5" fill="#7a5aa6">writer · stable · E2f-gated</text>

  <!-- H3K27me3 mark -->
  <rect x="240" y="388" width="160" height="66" rx="12" fill="#f3eefb" stroke="#9b7fc7" stroke-width="2"/>
  <text x="320" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#573f80">H3K27me3</text>
  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#7a5aa6">at the Ccnd1 locus</text>

  <!-- EZH2 -> mark -->
  <path d="M320,320 L320,386" stroke="#7a5aa6" stroke-width="2.2" fill="none" marker-end="url(#adk)"/>
  <text x="330" y="356" font-size="10.5" fill="#573f80">deposits (read-write)</text>

  <!-- CyclinD1 -->
  <rect x="745" y="300" width="210" height="118" rx="14" fill="#fdf1e0" stroke="#d98a2b" stroke-width="2.6"/>
  <text x="850" y="352" text-anchor="middle" font-size="26" font-weight="700" fill="#9a5e12">CyclinD1</text>
  <text x="850" y="374" text-anchor="middle" font-size="11" fill="#c07d2b">the proliferation output</text>
  <text x="850" y="398" text-anchor="middle" font-size="10.5" fill="#c07d2b">(drives Rb → E2f → cycle)</text>

  <!-- ===================== BRAKE: mark -| CyclinD1 ===================== -->
  <path d="M400,415 L742,392" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#tbar)"/>
  <text x="572" y="382" text-anchor="middle" font-size="12.5" font-weight="700" fill="#97281c">represses CyclinD1</text>
  <text x="572" y="428" text-anchor="middle" font-size="10.5" fill="#c0392b">leaky rheostat — throttles, never silences</text>

  <!-- ===================== RED DOWN-PUSHES ===================== -->
  <!-- on EZH2 (left of node) -->
  <g font-size="11" text-anchor="middle">
    <g><rect x="40" y="248" width="150" height="40" rx="9" fill="#fbeae7" stroke="#c0392b"/><text x="115" y="264" fill="#97281c">EZH2i</text><text x="115" y="278" fill="#97281c">blocks deposition</text></g>
    <g><rect x="40" y="300" width="150" height="44" rx="9" fill="#fbeae7" stroke="#c0392b"/><text x="115" y="316" fill="#97281c">G0 exit: E2f off</text><text x="115" y="330" fill="#97281c">→ EZH2 collapses</text></g>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ared)">
    <path d="M190,268 L223,272"/>
    <path d="M190,320 L223,300"/>
  </g>

  <!-- on the mark (below) -->
  <g font-size="11" text-anchor="middle">
    <g><rect x="70" y="520" width="176" height="44" rx="9" fill="#fbeae7" stroke="#c0392b"/><text x="158" y="536" fill="#97281c">replicative dilution</text><text x="158" y="550" fill="#97281c">∝ 1 / cycle period</text></g>
    <g><rect x="262" y="520" width="176" height="44" rx="9" fill="#fbeae7" stroke="#c0392b"/><text x="350" y="536" fill="#97281c">demethylation /</text><text x="350" y="550" fill="#97281c">turnover</text></g>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ared)">
    <path d="M175,520 C200,495 270,472 300,456"/>
    <path d="M350,520 L340,456"/>
  </g>

  <!-- on CyclinD1 (below) -->
  <g font-size="11" text-anchor="middle">
    <g><rect x="700" y="470" width="160" height="44" rx="9" fill="#fbeae7" stroke="#c0392b"/><text x="780" y="486" fill="#97281c">vismodegib →</text><text x="780" y="500" fill="#97281c">removes Gli drive</text></g>
    <g><rect x="875" y="470" width="160" height="44" rx="9" fill="#fbeae7" stroke="#c0392b"/><text x="955" y="486" fill="#97281c">mRNA / protein</text><text x="955" y="500" fill="#97281c">turnover</text></g>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ared)">
    <path d="M790,470 L820,420"/>
    <path d="M950,470 L888,420"/>
  </g>

  <!-- threshold caveat (grey) -->
  <rect x="690" y="545" width="450" height="52" rx="9" fill="#f1f4f8" stroke="#c3ccd7"/>
  <text x="915" y="567" text-anchor="middle" font-size="11.5" fill="#4b586a">INK4 (p16/p18) &amp; p27 raise the <tspan font-style="italic" font-weight="700">threshold</tspan> CyclinD1 must clear to fire</text>
  <text x="915" y="584" text-anchor="middle" font-size="11.5" fill="#4b586a">the cycle — a distinct brake on <tspan font-style="italic">function</tspan>, not on the CyclinD1 <tspan font-style="italic">level</tspan>.</text>

  <!-- ===================== EMERGENT-BEHAVIOR CALLOUTS ===================== -->
  <g font-size="11.8">
    <g>
      <rect x="34" y="662" width="360" height="182" rx="12" fill="#f7f9fb" stroke="#d5dde6"/>
      <circle cx="62" cy="690" r="14" fill="#7a5aa6"/><text x="62" y="695" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
      <text x="86" y="695" font-size="13.5" font-weight="700" fill="#333e4d">Progressive repression = buffering</text>
      <text x="52" y="722" fill="#3a4655">Both track mitogen, so each added Hh raises</text>
      <text x="52" y="740" fill="#3a4655">Gli <tspan font-weight="700">and</tspan> the EZH2/H3K27me3 brake. CyclinD1</text>
      <text x="52" y="758" fill="#3a4655">rises sub-linearly and is buffered against</text>
      <text x="52" y="776" fill="#3a4655">short mitogen swings (slow brake = low-pass).</text>
      <text x="52" y="802" fill="#3a4655">Onset of division is gated to a genuine Hh</text>
      <text x="52" y="820" fill="#3a4655">threshold, protecting against premature exit.</text>
    </g>
    <g>
      <rect x="410" y="662" width="360" height="182" rx="12" fill="#f7f9fb" stroke="#d5dde6"/>
      <circle cx="438" cy="690" r="14" fill="#2c7fb8"/><text x="438" y="695" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
      <text x="462" y="695" font-size="13.5" font-weight="700" fill="#333e4d">Proliferation sets the brake</text>
      <text x="428" y="722" fill="#3a4655">Dilution ∝ 1/period: fast cycling erases the</text>
      <text x="428" y="740" fill="#3a4655">mark (↑CyclinD1); a slowing / lengthening</text>
      <text x="428" y="758" fill="#3a4655">cycle lets it rebuild (↓CyclinD1). A long S-</text>
      <text x="428" y="776" fill="#3a4655">phase (HU) does both: more EZH2, more mark.</text>
      <text x="428" y="802" fill="#3a4655">So over developmental slowing, the brake</text>
      <text x="428" y="820" fill="#3a4655">tightens — a feed-forward toward exit.</text>
    </g>
    <g>
      <rect x="786" y="662" width="360" height="182" rx="12" fill="#f7f9fb" stroke="#d5dde6"/>
      <circle cx="814" cy="690" r="14" fill="#c0392b"/><text x="814" y="695" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
      <text x="838" y="695" font-size="13.5" font-weight="700" fill="#333e4d">G0 is reversible, not latched</text>
      <text x="804" y="722" fill="#3a4655">On cycle exit E2f falls, so the E2f-gated</text>
      <text x="804" y="740" fill="#3a4655">writer EZH2 collapses and the mark relaxes</text>
      <text x="804" y="758" fill="#3a4655">to a modest plateau (it does not run away).</text>
      <text x="804" y="776" fill="#3a4655">Arrest is monostable / metastable — "sticky"</text>
      <text x="804" y="794" fill="#3a4655">but reversible, not a bistable epigenetic</text>
      <text x="804" y="812" fill="#3a4655">lock. MYCN cannot hold EZH2 (Skp2-gated).</text>
    </g>
  </g>
</svg>
