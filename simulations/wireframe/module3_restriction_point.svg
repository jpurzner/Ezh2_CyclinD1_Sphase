rt" font-weight="bold" opacity="1.0"><tspan x="24" dy="0">Module 3 — Restriction point: two-step Rb, E2F and the Skp2–p27 commitment switch</tspan></text><text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic" opacity="1.0"><tspan x="24" dy="0">Cyclin D1–CDK4/6 primes Rb (mono-P, growth-gated); Cyclin E/A–CDK2 commits (hyper-P) and releases E2F; INK4 and p27 raise the threshold; Skp2 clears p27</tspan></text><rect x="45.0" y="302.0" width="150" height="56" rx="8" fill="#d0ece7" stroke="#0e6251" stroke-width="2.4" opacity="1.0"/><text x="120" y="327.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="120" dy="0">Cyclin D1</tspan></text><text x="120" y="349.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="120" dy="0">from Module 2</tspan></text><rect x="240.0" y="302.0" width="160" height="56" rx="8" fill="#d0ece7" stroke="#0e6251" stroke-width="1.5" opacity="1.0"/><text x="320" y="326.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="320" dy="0">Cyclin D1–CDK4/6</tspan></text><text x="320" y="345.625" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="320" dy="0">kinase, bounded Vmax</tspan></text><rect x="475.0" y="306.0" width="90" height="48" rx="8" fill="#fadbd8" stroke="#a93226" stroke-width="1.5" opacity="1.0"/><text x="520" y="326.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="520" dy="0">Rb</tspan></text><text x="520" y="346.40000000000003" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="520" dy="0">hypo-P</tspan></text><rect x="635.0" y="306.0" width="110" height="48" rx="8" fill="#f1948a" stroke="#a93226" stroke-width="1.5" opacity="1.0"/><text x="690" y="326.45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="690" dy="0">Rb mono-P</tspan></text><text x="690" y="344.84999999999997" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="690" dy="0">E2F still bound</tspan></text><rect x="815.0" y="306.0" width="110" height="48" rx="8" fill="#cb4335" stroke="#a93226" stroke-width="1.5" opacity="1.0"/><text x="870" y="326.45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="870" dy="0">Rb hyper-P</tspan></text><text x="870" y="344.84999999999997" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="870" dy="0">E2F released</tspan></text><rect x="1000.0" y="304.0" width="100" height="52" rx="8" fill="#ffffff" stroke="#2471a3" stroke-width="2" opacity="1.0"/><text x="1050" y="327.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="1050" dy="0">E2F</tspan></text><text x="1050" y="349.5" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="1050" dy="0">free</tspan></text><path d="M195.0,330 L240.0,330" fill="none" stroke="#0e6251" stroke-width="3.0" marker-end="url(#m0)" opacity="1.0" stroke-linecap="round"/><path d="M400.0,330 L475.0,330" fill="none" stroke="#0e6251" stroke-width="2.2" marker-end="url(#m0)" opacity="1.0" stroke-linecap="round"/><text x="438" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#0e6251" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="438" dy="0">phosphorylates</tspan></text><path d="M565.0,330 L635.0,330" fill="none" stroke="#a93226" stroke-width="2.4" marker-end="url(#m1)" opacity="1.0" stroke-linecap="round"/><path d="M635.0,344 L565.0,344" fill="none" stroke="#6b7280" stroke-width="1.0" marker-end="url(#m2)" opacity="1.0" stroke-linecap="round"/><text x="600" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a93226" text-anchor="middle" font-style="italic" font-weight="bold" opacity="1.0"><tspan x="600" dy="0">STEP 1 · mono-P</tspan></text><path d="M745.0,330 L815.0,330" fill="none" stroke="#a93226" stroke-width="2.4" marker-end="url(#m1)" opacity="1.0" stroke-linecap="round"/><path d="M815.0,344 L745.0,344" fill="none" stroke="#6b7280" stroke-width="1.0" marker-end="url(#m2)" opacity="1.0" stroke-linecap="round"/><text x="780" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a93226" text-anchor="middle" font-style="italic" font-weight="bold" opacity="1.0"><tspan x="780" dy="0">STEP 2 · hyper-P</tspan></text><path d="M925.0,330 L1000.0,330" fill="none" stroke="#2471a3" stroke-width="2.4" marker-end="url(#m3)" opacity="1.0" stroke-linecap="round"/><text x="965" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2471a3" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="965" dy="0">releases</tspan></text><text x="605" y="372" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="605" dy="0">Rb·E2F and Rb-mono-P·E2F complexes hold E2F: the mono-P state is the</tspan><tspan x="605" dy="11.875">transient-G0 buffer while the cell grows</tspan></text><rect x="965.0" y="442.0" width="170" height="56" rx="8" fill="#d6eaf8" stroke="#2471a3" stroke-width="1.5" opacity="1.0"/><text x="1050" y="466.625" font-family="Helvetica, Arial, sans-serif