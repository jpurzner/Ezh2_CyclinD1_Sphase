yle="italic" opacity="1.0"><tspan x="400" dy="0">raise Cyclin D1 needed</tspan></text><rect x="85.0" y="188.0" width="110" height="24" rx="12.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5" opacity="1.0"/><path d="M140,188.0 L140,212.0" fill="none" stroke="#e74c3c" stroke-width="1"/><text x="140" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="140" dy="0">palbociclib</tspan></text><path d="M195.0,200 L245,200 L240.0,302.0" fill="none" stroke="#e74c3c" stroke-width="2.0" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><text x="140" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#e74c3c" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="140" dy="0">Vmax block (not surmountable)</tspan></text><rect x="235.0" y="570.0" width="170" height="60" rx="8" fill="#fbeee6" stroke="#b9770e" stroke-width="2" opacity="1.0"/><text x="320" y="590.5500000000001" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="320" dy="0">p27 (CIP/KIP)</tspan></text><text x="320" y="610.1500000000001" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="320" dy="0">reset HIGH at birth (MB higher)</tspan><tspan x="320" dy="12.5">→ transient G0</tspan></text><path d="M308,570.0 L308,358.0" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#m5)" opacity="1.0" stroke-linecap="round"/><path d="M332,358.0 L332,570.0" fill="none" stroke="#0e6251" stroke-width="1.8" marker-end="url(#m7)" opacity="1.0" stroke-linecap="round"/><text x="340" y="470" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic" opacity="1.0"><tspan x="340" dy="0">mutual antagonism:</tspan><tspan x="340" dy="11.25">p27 brakes CDK4/6;</tspan><tspan x="340" dy="11.25">CDK4/6 clears p27</tspan><tspan x="340" dy="11.25">(growth-gated)</tspan></text><path d="M405.0,600 L1050,600 L1050,498.0" fill="none" stroke="#c0392b" stroke-width="2.0" marker-end="url(#m5)" opacity="1.0" stroke-linecap="round"/><text x="700" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" font-weight="bold" opacity="1.0"><tspan x="700" dy="0">p27 binds and inhibits Cyclin E/A–CDK2</tspan></text><path d="M1280,496.0 L1280,680 L320,680 L320,630.0" fill="none" stroke="#c0392b" stroke-width="2.0" marker-end="url(#m5)" opacity="1.0" stroke-linecap="round"/><text x="800" y="672" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" font-weight="bold" opacity="1.0"><tspan x="800" dy="0">Skp2 (SCF) degrades p27 — E2F → Skp2 → ⊣ p27 → CDK2 → more E2F</tspan></text><rect x="560" y="700" width="480" height="65" rx="8" fill="#ffffff" stroke="#2471a3" stroke-width="1.4" opacity="1.0"/><text x="572" y="718" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2471a3" text-anchor="start" font-weight="bold" opacity="1.0"><tspan x="572" dy="0">Skp2–p27 feedforward = bistable commitment switch</tspan></text><text x="572" y="733" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="572" dy="0">G0: E2F off → Skp2 low → p27 high → CDK2 off (self-sustaining, p27⁺)</tspan></text><text x="572" y="748" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="572" dy="0">Commit: mono-P leaks E2F → Skp2 up → p27 cleared → hyper-P → E2F on</tspan></text><rect x="475.0" y="442.0" width="170" height="56" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" opacity="1.0"/><text x="560" y="466.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight=