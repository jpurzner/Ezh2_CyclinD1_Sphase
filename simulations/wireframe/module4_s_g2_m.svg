<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#607d8b"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M8,0 L8,10" stroke="#e74c3c" stroke-width="2.4"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17a2b8"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M8,0 L8,10" stroke="#c0392b" stroke-width="2.4"/></marker><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca6f1e"/></marker><marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#922b21"/></marker><marker id="m7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8f4a"/></marker><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d3c98"/></marker></defs><rect x="0" y="0" width="1400" height="800" fill="#ffffff"/><text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2c3e50" text-anchor="start" font-weight="bold" opacity="1.0"><tspan x="24" dy="0">Module 4 — S / G2 / M engine: explicit replication, checkpoint, mitotic switch, division</tspan></text><text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic" opacity="1.0"><tspan x="24" dy="0">CDK2 + size gate fire origins → forks synthesise DNA at a fork speed (HU slows it) → CHK1 holds mitosis until replication completes → Cyclin B–CDK1 switch → APC/C → division resets the daughter</tspan></text><rect x="60.0" y="305.0" width="180" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" opacity="1.0"/><text x="150" y="326.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="150" dy="0">Cyclin E/A–CDK2</tspan></text><text x="150" y="345.625" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="150" dy="0">Module 3</tspan></text><rect x="60.0" y="408.0" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" opacity="1.0"/><text x="150" y="426.27500000000003" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="150" dy="0">size gate (cell mass)</tspan></text><text x="150" y="444.07500000000005" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="150" dy="0">Module 3</tspan></text><rect x="260.0" y="188.0" width="140" height="24" rx="12.0" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5" opacity="1.0"/><path d="M330,188.0 L330,212.0" fill="none" stroke="#e74c3c" stroke-width="1"/><text x="330" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="330" dy="0">hydroxyurea (HU)</tspan></text><rect x="325.0" y="298.0" width="190" height="64" rx="8" fill="#d1f2eb" stroke="#17a2b8" stroke-width="1.5" opacity="1.0"/><text x="420" y="320.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="420" dy="0">origin firing</tspan></text><text x="420" y="340.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="420" dy="0">licensed → fired → active forks</tspan><tspan x="420" dy="12.5">(+ PCNA)</tspan></text><path d="M240.0,330 L325.0,330" fill="none" stroke="#2471a3" stroke-width="2.4" marker-end="url(#m0)" opacity="1.0" stroke-linecap="round"/><path d="M240.0,430 L300,430 L300,346 L325.0,346" fill="none" stroke="#607d8b" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#m1)" opacity="1.0" stroke-linecap="round"/><path d="M300,371 L309,380 L300,389 L291,380 z" fill="#ffffff" stroke="#607d8b" stroke-width="1.6"/><text x="282" y="366" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#607d8b" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="282" dy="0">size</tspan></text><path d="M280.0,212.0 L400,298.0" fill="none" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#m2)" opacity="1.0" stroke-linecap="round"/><text x="345" y="245" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#e74c3c" text-anchor="end" font-style="italic" opacity="1.0"><tspan x="345" dy="0">blocks new firing</tspan><tspan x="345" dy="11.25">(replication stress)</tspan></text><rect x="580.0" y="298.0" width="200" height="64" rx="8" fill="#d1f2eb" stroke="#17a2b8" stroke-width="2" opacity="1.0"/><text x="680" y="320.55" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="680" dy="0">DNA replication</tspan></text><text x="680" y="340.15000000000003" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="680" dy="0">forks copy the genome</tspan><tspan x="680" dy="12.5">at a set fork speed</tspan></text><path d="M515.0,330 L580.0,330" fill="none" stroke="#17a2b8" stroke-width="2.4" marker-end="url(#m3)" opacity="1.0" stroke-linecap="round"/><path d="M380.0,212.0 L660,298.0" fill="none" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#m2)" opacity="1.0" stroke-linecap="round"/><text x="618" y="290" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#e74c3c" text-anchor="end" font-style="italic" opacity="1.0"><tspan x="618" dy="0">slows forks → S lengthens (G1 unchanged)</tspan></text><rect x="460.0" y="173.0" width="200" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" opacity="1.0"/><text x="560" y="193.67499999999998" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="560" dy="0">p27 (Module 3) ⊣ PCNA·forks</tspan></text><path d="M560,207.0 L640,298.0" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#m4)" opacity="0.7" stroke-linecap="round"/><rect x="565.0" y="448.0" width="230" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" opacity="1.0"/><text x="680" y="466.45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="680" dy="0">halves H3K27me3 at Ccnd1</tspan></text><text x="680" y="484.84999999999997" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="680" dy="0">Module 2 · replicative dilution</tspan></text><path d="M680,362.0 L680,448.0" fill="none" stroke="#2471a3" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#m0)" opacity="1.0" stroke-linecap="round"/><rect x="825.0" y="176.0" width="150" height="48" rx="8" fill="#fdebd0" stroke="#ca6f1e" stroke-width="1.5" opacity="1.0"/><text x="900" y="196.79999999999998" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="900" dy="0">CHK1</tspan></text><text x="900" y="216.39999999999998" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="900" dy="0">active while forks run</tspan></text><path d="M750.0,298.0 L750,200 L825.0,200" fill="none" stroke="#ca6f1e" stroke-width="1.6" marker-end="url(#m5)" opacity="1.0" stroke-linecap="round"/><rect x="870.0" y="298.0" width="180" height="64" rx="8" fill="#ffffff" stroke="#ca6f1e" stroke-width="1.5" opacity="1.0"/><text x="960" y="320.02500000000003" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="960" dy="0">Cyclin B–CDK1 (inactive)</tspan></text><text x="960" y="337.82500000000005" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="960" dy="0">Tyr15-P · made as replication</tspan><tspan x="960" dy="12.5">completes (real G2)</tspan></text><path d="M780.0,330 L870.0,330" fill="none" stroke="#17a2b8" stroke-width="2.2" marker-end="url(#m3)" opacity="1.0" stroke-linecap="round"/><text x="920" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#17a2b8" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="920" dy="0">DNA complete</tspan></text><rect x="1070.0" y="202.0" width="220" height="56" rx="8" fill="#fdebd0" stroke="#ca6f1e" stroke-width="1.5" opacity="1.0"/><text x="1180" y="226.79999999999998" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="1180" dy="0">Cdc25 ⇄ Wee1</tspan></text><text x="1180" y="246.39999999999998" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="1180" dy="0">bistable Tyr15 switch</tspan></text><rect x="1140.0" y="398.0" width="180" height="64" rx="8" fill="#f5b7b1" stroke="#922b21" stroke-width="2.2" opacity="1.0"/><text x="1230" y="426.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="1230" dy="0">Cyclin B–CDK1 (MPF)</tspan></text><text x="1230" y="445.625" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="1230" dy="0">active · mitotic entry</tspan></text><path d="M1050.0,330 L1180,330 L1180,398.0" fill="none" stroke="#922b21" stroke-width="2.4" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><path d="M1180,258.0 L1180,322" fill="none" stroke="#ca6f1e" stroke-width="1.6" marker-end="url(#m5)" opacity="1.0" stroke-linecap="round"/><text x="1172" y="290" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#ca6f1e" text-anchor="end" font-style="italic" opacity="1.0"><tspan x="1172" dy="0">Cdc25 activates · Wee1 inactivates</tspan></text><path d="M1270,398.0 L1270,258.0" fill="none" stroke="#922b21" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><text x="1282" y="322" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#922b21" text-anchor="start" font-style="italic" opacity="1.0"><tspan x="1282" dy="0">MPF → Cdc25</tspan><tspan x="1282" dy="11.25">MPF ⊣ Wee1</tspan><tspan x="1282" dy="11.25">(hysteresis)</tspan></text><path d="M975.0,200 L1070.0,230" fill="none" stroke="#c0392b" stroke-width="2.0" marker-end="url(#m4)" opacity="1.0" stroke-linecap="round"/><text x="1020" y="168" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle" font-style="italic" font-weight="bold" opacity="1.0"><tspan x="1020" dy="0">unfinished S holds the switch OFF</tspan></text><rect x="915.0" y="404.0" width="170" height="52" rx="8" fill="#ffffff" stroke="#922b21" stroke-width="1.5" opacity="1.0"/><text x="1000" y="426.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="1000" dy="0">APC/C–Cdc20</tspan></text><text x="1000" y="445.625" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="1000" dy="0">degrades Cyclin A / B</tspan></text><path d="M1140.0,442 L1085.0,442" fill="none" stroke="#922b21" stroke-width="1.6" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><path d="M1085.0,418 L1140.0,418" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#m4)" opacity="1.0" stroke-linecap="round"/><text x="1060" y="478" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="1060" dy="0">MPF activates Cdc20; Cdc20 destroys cyclins → mitotic exit</tspan></text><rect x="880" y="520" width="470" height="125" rx="8" fill="#fdf2f0" stroke="#922b21" stroke-width="1.4" opacity="1.0"/><text x="892" y="538" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="start" font-weight="bold" opacity="1.0"><tspan x="892" dy="0">DIVISION  (MPF crosses threshold)</tspan></text><text x="892" y="553" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="892" dy="0">DNA → 0, origins re-licensed</tspan></text><text x="892" y="568" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="892" dy="0">Rb → hypo-P, E2F re-bound (partial carry-over if committed)</tspan></text><text x="892" y="583" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="892" dy="0">p27 → BIRTH level (GNP low, MB higher) → transient G0</tspan></text><text x="892" y="598" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="892" dy="0">Skp2, Cyclin E/A, MPF, Cdc20 → low</tspan></text><text x="892" y="613" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="892" dy="0">cell mass ÷ 2</tspan></text><text x="892" y="628" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="892" dy="0">INHERITED: H3K27me3 at Ccnd1 · EZH2 concentration</tspan></text><path d="M1230,462.0 L1230,520" fill="none" stroke="#922b21" stroke-width="2.6" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><rect x="230.0" y="523.0" width="260" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" opacity="1.0"/><text x="360" y="541.4499999999999" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="360" dy="0">daughters re-enter G0/G1</tspan></text><text x="360" y="559.8499999999999" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="360" dy="0">Module 3 · p27-high transient G0</tspan></text><path d="M880,570 L490.0,545" fill="none" stroke="#922b21" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><rect x="230.0" y="583.0" width="260" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4" opacity="1.0"/><text x="360" y="601.4499999999999" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="360" dy="0">mark + EZH2 carried into next cycle</tspan></text><text x="360" y="619.8499999999999" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic" opacity="1.0"><tspan x="360" dy="0">Module 2</tspan></text><path d="M880,600 L490.0,605" fill="none" stroke="#922b21" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#m6)" opacity="1.0" stroke-linecap="round"/><rect x="300" y="730" width="173.33333333333334" height="22" rx="4" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.2" opacity="1.0"/><text x="386.6666666666667" y="745.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2471a3" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="386.6666666666667" dy="0">S-entry</tspan></text><rect x="473.33333333333337" y="730" width="381.3333333333333" height="22" rx="4" fill="#d1f2eb" stroke="#17a2b8" stroke-width="1.2" opacity="1.0"/><text x="664.0" y="745.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#17a2b8" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="664.0" dy="0">S phase</tspan></text><rect x="854.6666666666667" y="730" width="242.66666666666666" height="22" rx="4" fill="#fdebd0" stroke="#ca6f1e" stroke-width="1.2" opacity="1.0"/><text x="976.0000000000001" y="745.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ca6f1e" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="976.0000000000001" dy="0">G2</tspan></text><rect x="1097.3333333333335" y="730" width="242.66666666666666" height="22" rx="4" fill="#f5b7b1" stroke="#922b21" stroke-width="1.2" opacity="1.0"/><text x="1218.6666666666667" y="745.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="middle" font-weight="bold" opacity="1.0"><tspan x="1218.6666666666667" dy="0">M → division</tspan></text><text x="300" y="770" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-style="italic" opacity="1.0"><tspan x="300" dy="0">S-phase length is emergent (fork speed × genome), so it can be stretched by HU without touching G1 — and a longer S means more EZH2 (Module 2).</tspan></text><rect x="40" y="660" width="250" height="96" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" opacity="1.0"/><path d="M52,678 L92,678" fill="none" stroke="#1f8f4a" stroke-width="1.8" marker-end="url(#m7)" opacity="1.0" stroke-linecap="round"/><text x="102" y="682" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="102" dy="0">activation / conversion</tspan></text><path d="M52,698 L92,698" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#m4)" opacity="1.0" stroke-linecap="round"/><text x="102" y="702" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="102" dy="0">inhibition</tspan></text><path d="M52,718 L92,718" fill="none" stroke="#e74c3c" stroke-width="1.8" marker-end="url(#m2)" opacity="1.0" stroke-linecap="round"/><text x="102" y="722" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="102" dy="0">drug</tspan></text><path d="M52,738 L92,738" fill="none" stroke="#7d3c98" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#m8)" opacity="1.0" stroke-linecap="round"/><text x="102" y="742" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="start" opacity="1.0"><tspan x="102" dy="0">hand-off / feedback</tspan></text></svg>